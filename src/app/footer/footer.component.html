  <div class="container">
    <div class="row g-2">
      <!-- Colonne Logo et Copyright -->
      <div
        class="col-md-3 text-md-start d-flex flex-column align-items-center align-items-md-start text-center"

        <small class="text-white">© {{ this.currentYear }} Enzo Fournet</small>
        <img
          src="assets/images/enzo_frnt.webp"
          alt="Logo Portfolio"
          height="30"
          class="mb-1"
        />
      </div>

      <!-- Colonne Navigation -->
      <div class="col-md-5">
        <h6 class="mb-1 text-white">Navigation</h6>
        <div class="row g-0">
          <div class="col-6">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a
                  class="nav-link px-0 py-1 text-white"
                  [routerLink]="['/home']"
                  >Accueil</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link px-0 py-1 text-white" [routerLink]="['/cv']"
                  >CV</a
                >
              </li>
            </ul>
          </div>
          <div class="col-6">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a
                  class="nav-link px-0 py-1 text-white"
                  [routerLink]="['/projects']"
                  >Projets</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Colonne Réseaux sociaux -->
      <div class="col-md-4">
        <h6 class="mb-1 text-white">Me contacter</h6>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a
              class="nav-link px-0 py-1 text-white"
              href="https://github.com/enzofrnt"
              target="_blank"
            >

          </li>
          <li class="nav-item">
            <a
              class="nav-link px-0 py-1 text-white"
              href="https://www.linkedin.com/in/enzofrnt/"
              target="_blank"

          </li>
          <li class="nav-item">
            <a
              class="nav-link px-0 py-1 text-white"
              href="mailto:contact&#64;enzo-frnt.fr"
            >
              <i class="bi bi-envelope me-2"></i>contact&#64;enzo-frnt.fr

          </li>
        </ul>
      </div>
    </div>
