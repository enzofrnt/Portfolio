<div class="container py-5">
  <h1 class="display-4 mb-4">Mon CV</h1>

  <div class="cv-container">
    <div #cvWrapper class="cv-wrapper">
      <iframe
        loading="lazy"
        [src]="cvSrc"
        title="CV Enzo Fournet"
        [style.scale]="scale"
        scrolling="no">
      </iframe>
    </div>
  </div>

  <div class="d-flex justify-content-center gap-3 mt-4">
    <a href="assets/pdf/CV.pdf"
      download
      class="btn btn-secondary">
      <i class="bi bi-download me-2"></i>Télécharger le PDF
    </a>
  </div>
</div>
