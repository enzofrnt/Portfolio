<div class="card h-100" id="project-card">
  <img
    [ngSrc]="logoSrc"
    width="300"
    height="300"
    class="card-img-top"
    alt="{{ project.name }}"
    (error)="onLogoError()"
  />
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ project.name }}</h5>
    <p class="card-text">{{ project.description }}</p>
    <hr class="my-4 mt-0" />
    <div class="d-flex align-items-center mt-auto">
      <a
        [routerLink]="['/projects', project.id]"
        class="btn btn-primary flex-grow-1 me-2"
      >
        Voir le projet
      </a>
      <a
        [href]="project.link"
        *ngIf="project.link"
        class="btn btn-secondary"
        target="_blank"
        [attr.aria-label]="
          'Button pour oubrir le gihtub du projet ' + project.name
        "
      >
        <i class="bi bi-github"></i>
      </a>
    </div>
  </div>
</div>
